[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src/eel"
exclude = ["^build/", "^install/", "^log/", "^venv/"]

# Strict wedge — add paths here as each batch is clean.
files = [
    "src/eel/eel/utils/utils.py",
    "src/eel/eel/leakage/leakage_source.py",
    "src/eel/eel/tank/tank_utils/tank_base.py",
]
