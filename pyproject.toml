[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src/eel"
exclude = ["^build/", "^install/", "^log/", "^venv/"]

# Strict wedge — add paths here as each batch is clean.
files = [
    "src/eel/eel/utils/utils.py",
    "src/eel/eel/utils/throttle.py",
    "src/eel/eel/utils/forward_serial.py",
    "src/eel/eel/utils/pid_controller.py",
    "src/eel/eel/utils/serial_helpers.py",
    "src/eel/eel/utils/nav.py",
    "src/eel/eel/leakage/leakage_source.py",
    "src/eel/eel/leakage/leakage_sim.py",
    "src/eel/eel/leakage/leakage_sensor.py",
    "src/eel/eel/modem/modem_simulator.py",
    "src/eel/eel/pressure/pressure_sensor.py",
    "src/eel/eel/localization/localizer.py",
    "src/eel/eel/localization/localization.py",
    "src/eel/eel/motor/motor_sim.py",
    "src/eel/eel/gnss/gnss_sensor.py",
    "src/eel/eel/gnss/gnss_node.py",
    "src/eel/eel/battery/battery_utils.py",
    "src/eel/eel/battery/battery_sensor.py",
    "src/eel/eel/battery/battery_sim.py",
    "src/eel/eel/battery/battery_node.py",
    "src/eel/eel/dive/dive_action_server.py",
    "src/eel/eel/dive/dive_action_client.py",
    "src/eel/eel/navigation/common.py",
    "src/eel/eel/navigation/assignments.py",
    "src/eel/eel/navigation/navigation_action_client.py",
    "src/eel/eel/navigation/navigation_action_server.py",
    "src/eel/eel/tank/tank_utils/tank_base.py",
]
