[project]
name = "eel-workspace"
version = "1.2.2"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
mypy_path = "src/eel:typings"
packages = ["eel"]
exclude = ["^build/", "^install/", "^log/", "^venv/"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["build", "install", "log", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_parser = "conventional"
build_command = """
python3 scripts/sync_version.py
git add src/eel/setup.py src/eel/package.xml src/eel_interfaces/package.xml src/eel_bringup/package.xml
"""

[tool.semantic_release.branches.main]
match = "^main$"

[tool.semantic_release.changelog]
mode = "update"

[tool.pytest.ini_options]
markers = [
    "launch_test: ROS launch test (requires sourced ROS + built workspace)",
]
