name: Docker build & test Eel (multi-distro)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run Python checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install "src/eel[dev]"
          make test-ci

  build:
    needs: test-checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ros_distro: [humble, jazzy, lyrical]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build for ${{ matrix.ros_distro }}
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile.ros.${{ matrix.ros_distro }}
          platforms: linux/amd64,linux/arm64
          build-args: ROS_DISTRO=${{ matrix.ros_distro }}
          context: .
          push: false
          tags: foxpoint/eel:${{ matrix.ros_distro }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: [test-checks, build]
    steps:
      - uses: sarisia/actions-status-discord@v1.16.0
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_BUILD_CHANNEL }}
          status: ${{ (needs.test-checks.result == 'success' && needs.build.result == 'success') && 'success' || 'failure' }}
          title: "Eel CI (checks + humble, jazzy, lyrical)"
          username: GitHub Actions
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
